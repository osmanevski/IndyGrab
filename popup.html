<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>IndyGrab</title>
    <script src="theme.js"></script>
    <script src="launcher.js" defer></script>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0a0b0d; --surface: #16171b; --surface-soft: #1f2025;
            --border: rgba(210,190,192,.16); --text: #f4eeee; --muted: #a9abb2;
            --primary: #2563eb; --primary-light: #60a5fa;
        }
        :root[data-theme="light"] {
            color-scheme: light;
            --bg: #f4f6f9; --surface: #ffffff; --surface-soft: #eef1f6;
            --border: rgba(20,24,33,.12); --text: #16181d; --muted: #5c6470;
            --primary: #2563eb; --primary-light: #1d4ed8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 320px; padding: 16px; background: var(--bg); color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .wordmark { height: 26px; display: block; }
        #theme-toggle {
            width: 30px; height: 30px; border-radius: 9px; cursor: pointer; font-size: 14px; line-height: 1;
            background: var(--surface-soft); border: 1px solid var(--border); color: var(--text);
        }
        .status {
            display: flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 600;
            background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
            padding: 8px 11px; margin-bottom: 12px;
        }
        #auto-dot { width: 7px; height: 7px; border-radius: 50%; background: #8b95a5; flex: none; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
        .stat {
            background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
            padding: 10px 6px; text-align: center;
        }
        .stat b { display: block; font-size: 17px; color: var(--primary-light); line-height: 1.2; }
        .stat span { font-size: 9.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
        .primary-btn {
            display: block; width: 100%; padding: 13px; border: none; border-radius: 11px; cursor: pointer;
            background: linear-gradient(135deg, var(--primary), #1747b5); color: #fff;
            font-size: 14px; font-weight: 700; margin-bottom: 10px; transition: transform .15s;
        }
        .primary-btn:hover { transform: translateY(-1px); }
        .links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .links button {
            padding: 9px 4px; border-radius: 9px; cursor: pointer; font-size: 11.5px; font-weight: 600;
            background: var(--surface-soft); border: 1px solid var(--border); color: var(--text);
            transition: transform .15s, border-color .2s;
        }
        .links button:hover { transform: translateY(-1px); border-color: var(--primary); }
        .hint { margin-top: 12px; font-size: 10.5px; color: var(--muted); text-align: center; line-height: 1.5; }

        .stat-clickable { cursor: pointer; transition: border-color .15s, transform .15s; }
        .stat-clickable:hover { border-color: var(--primary); transform: translateY(-1px); }
        .stat-clickable.open { border-color: var(--primary); }

        .memory-panel { display: none; margin-bottom: 12px; }
        .memory-panel.open { display: block; }
        .memory-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-size: 11px; font-weight: 700; color: var(--muted); }

        .collector {
            display: none; /* varsayılan gizli; "🧲 ASIN Topla" butonuyla açılır */
            background: var(--surface); border: 1px solid var(--border); border-radius: 11px;
            padding: 11px; margin-top: 10px;
        }
        .collector.open { display: block; }
        .links button.active { border-color: var(--primary); color: var(--primary-light); }
        .collector-head { display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; font-weight: 700; margin-bottom: 9px; }
        .collect-hint { font-size: 9.5px; font-weight: 600; color: var(--muted); }
        .collect-hint.warn { color: #f5ad42; }
        .collector-actions { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 6px; margin-bottom: 9px; }
        .mini-btn {
            padding: 7px 4px; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: 600;
            background: var(--surface-soft); border: 1px solid var(--border); color: var(--text);
            transition: border-color .15s, transform .15s;
        }
        .mini-btn:hover:not(:disabled) { border-color: var(--primary); transform: translateY(-1px); }
        .mini-btn:disabled { opacity: .45; cursor: not-allowed; }
        .mini-btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
        .asin-box {
            max-height: 132px; overflow-y: auto; background: var(--bg); border: 1px solid var(--border);
            border-radius: 9px; padding: 8px; font-size: 11.5px; line-height: 1.65; color: var(--text);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all;
            white-space: pre-wrap; /* ASIN'ler satır satır görünsün */
        }
        .asin-box:empty::before { content: 'Boş'; color: var(--muted); }
        .asin-box .empty { color: var(--muted); font-family: inherit; }
        .primary-btn.slim { padding: 9px; font-size: 12.5px; margin: 9px 0 0; }
        .primary-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    </style>
</head>
<body>
    <div class="head">
        <img class="wordmark" src="assets/wordmark-indygrab.png" alt="IndyGrab">
        <button id="theme-toggle" title="Aydınlık moda geç">☀️</button>
    </div>

    <div class="status">
        <span id="auto-dot"></span><span id="auto-state">Beklemede</span>
    </div>

    <div class="stats">
        <div class="stat"><b id="stat-stores">0</b><span>Mağaza</span></div>
        <div class="stat"><b id="stat-products">0</b><span>Ürün</span></div>
        <div class="stat stat-clickable" id="memory-stat" title="Hafızadaki ASIN'leri göster/gizle"><b id="stat-asins">0</b><span>ASIN ▾</span></div>
    </div>

    <div id="memory-panel" class="memory-panel">
        <div class="memory-head">
            <span id="memory-title">Hafıza</span>
            <button id="memory-copy" class="mini-btn">Kopyala</button>
        </div>
        <div id="memory-list" class="asin-box"></div>
    </div>

    <button class="primary-btn" data-open="research.html">🚀 Kontrol Panelini Aç</button>

    <div class="links">
        <button id="toggle-collector" title="Açık Amazon sayfasından ASIN topla">🧲 ASIN Topla</button>
        <button data-open="research.html#section-asin-blacklist">Kara liste</button>
        <button data-open="research.html#section-mixer">Mixer</button>
    </div>

    <div id="collector" class="collector">
        <div class="collector-head">
            <span>🧲 Amazon ASIN Toplayıcı</span>
            <span id="collect-hint" class="collect-hint"></span>
        </div>
        <div class="collector-actions">
            <button id="collect-btn" class="mini-btn primary">Sayfayı Tara</button>
            <button id="auto-start-btn" class="mini-btn">▶ Oto</button>
            <button id="auto-stop-btn" class="mini-btn">⏹ Dur</button>
        </div>
        <div id="asin-box" class="asin-box">Amazon arama sayfasında “Sayfayı Tara”ya bas.</div>
        <button id="save-memory-btn" class="primary-btn slim" disabled>Hafızaya Kaydet (0 ASIN)</button>
    </div>

    <p class="hint">Filtre ayarları ve ASIN kara listesi<br>Kontrol Paneli → <b>Amazon Paneli</b> içinde.</p>
</body>
</html>
